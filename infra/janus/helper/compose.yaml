# DAP HELPER for creator analytics (docs/ANALYTICS_IMPLEMENTATION.md).
# Run by an operator INDEPENDENT of the creator's instance (Divvi Up, a partner
# nonprofit, or an unrelated paired instance). Same host, same admin, same cloud
# account or same company as the leader defeats the design: the two shares of every
# report can then be recombined.
#
#   cp .env.example .env   # set PGPASSWORD and DATASTORE_KEYS; never reuse the leader's
#   docker compose up -d
#   docker compose run --rm cli provision-tasks --generate-missing-parameters /tasks/<task>.helper.yaml
#
# In DAP-09 the helper is a single process: the leader drives aggregation by calling it.
# Images are pinned by digest; the tag is informational.

name: dap-helper

x-logging: &logging
  driver: ${LOG_DRIVER:-local}
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  read_only: true
  user: "65534:65534"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp

x-janus: &janus
  image: us-west2-docker.pkg.dev/divviup-artifacts-public/janus/janus_aggregator:0.7.143@sha256:a3bd90477d202ffb990b2b1f813e283da7b473121b3d3c2c5ef534f0b726a293
  <<: *hardening
  restart: unless-stopped
  logging: *logging
  networks: [internal]
  depends_on:
    migrate:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/healthz"]
    interval: 15s
    timeout: 5s
    retries: 5

x-janus-env: &janus-env
  PGPASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
  DATASTORE_KEYS: ${DATASTORE_KEYS:?set DATASTORE_KEYS in .env}
  RUST_LOG: ${RUST_LOG:-info}

services:
  postgres:
    image: ${DOCKERHUB:-docker.io}/library/postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: janus
      POSTGRES_DB: janus
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
    volumes:
      - helper-db:/var/lib/postgresql/data
    networks: [internal]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janus -d janus"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: us-west2-docker.pkg.dev/divviup-artifacts-public/janus/janus_db_migrator:0.7.143@sha256:bde44db3290fe8c17c26989783729ab073f6d05f99efe14a032701759495a1fa
    <<: *hardening
    restart: "no"
    logging: *logging
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    command: ["migrate", "run", "--source", "/migrations", "--database-url", "postgres://janus:${PGPASSWORD}@postgres:5432/janus"]

  aggregator:
    <<: *janus
    environment:
      <<: *janus-env
      BINARY: aggregator
    # The image entrypoint needs at least one argument.
    command: ["--config-file", "/etc/janus/aggregator.yaml"]
    volumes:
      - ./config/aggregator.yaml:/etc/janus/aggregator.yaml:ro
    networks: [internal, public]
    ports:
      - "${HELPER_BIND:-127.0.0.1}:${HELPER_PORT:-9002}:8080"

  cli:
    <<: *janus
    restart: "no"
    profiles: [cli]
    environment:
      <<: *janus-env
      BINARY: janus_cli
      CONFIG_FILE: /etc/janus/janus_cli.yaml
    volumes:
      - ./config/janus_cli.yaml:/etc/janus/janus_cli.yaml:ro
      - ${TASKS_DIR:-./tasks}:/tasks:ro
    healthcheck:
      disable: true

  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    profiles: [tls]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    logging: *logging
    depends_on:
      - aggregator
    ports:
      - "80:80"
      - "443:443"
    environment:
      DAP_DOMAIN: ${HELPER_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp
    networks: [public]

networks:
  internal:
    internal: true
  public: {}

volumes:
  helper-db: {}
  caddy-data: {}
  caddy-config: {}
