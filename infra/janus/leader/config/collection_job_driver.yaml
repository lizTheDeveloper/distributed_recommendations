database:
  url: "postgres://janus@postgres:5432/janus"
health_check_listen_address: "0.0.0.0:8000"
job_discovery_interval_s: 10
max_concurrent_job_workers: 10
worker_lease_duration_s: 600
worker_lease_clock_skew_allowance_s: 60
maximum_attempts_before_failure: 10
batch_aggregation_shard_count: 32
logging_config:
  force_json_output: true
# A collection requested before aggregation finishes is retried after this delay
# (Janus default 600 s, growing x1.25 to 3600 s).
min_collection_job_retry_delay_s: 30
max_collection_job_retry_delay_s: 300
collection_job_retry_delay_exponential_factor: 1.25
