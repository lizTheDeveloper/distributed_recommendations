# Local test overlay: Caddy on https://localhost:8443 with its own local CA,
# GlitchTip's dev bootstrap (a throwaway user, org, project and DSN). Never use in
# production: DEBUG is on. Used by test/smoke.sh.
services:
  glitchtip:
    environment:
      DEBUG: "true"
      GLITCHTIP_BOOTSTRAP_DEV: "true"
  caddy:
    ports: !override
      - "127.0.0.1:8443:443"
