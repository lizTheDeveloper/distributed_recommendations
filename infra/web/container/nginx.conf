# Static PWA. No access log: the server keeps no record of who loaded the app (docs/SHIPPING.md,
# Phase 1). The CSP repeats the meta tag in index.html and adds frame-ancestors, which a meta tag
# can't set; 'self' because the app frames its own psi-frame.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log off;
    server_tokens off;

    types {
        application/manifest+json webmanifest;
        application/wasm wasm;
    }

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https: data:; connect-src 'self' https: wss:; frame-src 'self' https:; media-src https:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # File names aren't hashed, so every response revalidates (ETag) instead of going stale.
    add_header Cache-Control "no-cache" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
