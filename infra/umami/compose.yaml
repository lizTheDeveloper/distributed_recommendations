# Self-hosted Umami (MIT) for the app's opt-in usage analytics (docs/TELEMETRY.md):
# Umami + Postgres behind Caddy (automatic TLS), plus a retention job.
#
#   cp .env.example .env    # then edit UMAMI_DOMAIN, ACME_EMAIL, APP_SECRET, ...
#   docker compose up -d
#
# Images are pinned by digest; Dependabot proposes updates. Client IPs never reach
# Umami: Caddy drops every forwarding header, so Umami sees no client address, does
# no geolocation (country/region/city stay empty) and can't mix the IP into its
# session hash. See README.md "IP addresses".

name: app-umami

x-logging: &logging
  driver: ${LOG_DRIVER:-local}
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-db-env: &db-env
  POSTGRES_DB: umami
  POSTGRES_USER: umami
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

services:
  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    <<: *hardening
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    restart: unless-stopped
    logging: *logging
    environment: *db-env
    command: ["postgres", "-c", "log_connections=off", "-c", "log_disconnections=off"]
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:3.4.0@sha256:85909afc45bdcda1917394594a087421fdbb05610fded0fa9f6fb861abb2f367
    <<: *hardening
    init: true
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:?set TWO_FACTOR_ENCRYPTION_KEY in .env}
      # No phone-home pixel, no update checks.
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
      # Never take a location from CDN headers (there is no CDN; Caddy strips them too).
      SKIP_LOCATION_HEADERS: "1"
      # Visitor hash salt rotates monthly (Umami's default, made explicit).
      SALT_ROTATION: month
    tmpfs:
      - /tmp
    expose:
      - "3000"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Umami keeps data forever by default. This deletes events, event data and
  # sessions older than RETENTION_DAYS (default 30), every hour.
  retention:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    <<: *hardening
    read_only: true
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    user: "70:70"
    environment:
      PGHOST: postgres
      PGUSER: umami
      PGDATABASE: umami
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS:-3600}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        while :; do
        psql -q -v ON_ERROR_STOP=1 -v days="$${RETENTION_DAYS}" -f /retention.sql || echo "retention failed";
        sleep "$${RETENTION_INTERVAL_SECONDS}";
        done
    volumes:
      - ./retention.sql:/retention.sql:ro
    networks: [internal]

  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    <<: *hardening
    read_only: true
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    logging: *logging
    depends_on:
      - umami
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      UMAMI_DOMAIN: ${UMAMI_DOMAIN:?set UMAMI_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp
    networks: [internal]

networks:
  internal: {}

volumes:
  pg-data: {}
  caddy-data: {}
  caddy-config: {}
