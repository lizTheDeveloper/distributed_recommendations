##
## strfry config for the app's default/optional Nostr relay.
## Based on the default config of the pinned image (strfry 1.1.2-148-g4cd3cf6).
## Values that depend on the deployment (name, contact, auth URL) are set from
## .env by compose.yaml with --set, so this file stays the same everywhere.
##
## Why each non-default value is what it is: see README.md, "Configuration".
##

db = "./strfry-db/"

dbParams {
    maxreaders = 256
    # 10 TB of address space, not disk.
    mapsize = 10995116277760
    noReadAhead = false
}

events {
    # docs/PROTOCOL.md: a gift wrap's JSON is <= 65,536 bytes; NIP-17 sketches stop
    # at the 128 bucket (~33 KB wraps) precisely so they fit this limit.
    maxEventSize = 65536

    rejectEventsNewerThanSeconds = 900

    # Gift wraps and seals backdate created_at by up to 2 days (NIP-59); 3 years is
    # far more than enough. Gift-wrap lifetime is enforced by the write policy
    # (NIP-40 expiration required) and by the retention job, not here.
    rejectEventsOlderThanSeconds = 94608000

    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    # Inside the compose network only; Caddy is the only thing that can reach it.
    bind = "0.0.0.0"
    port = 7777

    # compose.yaml sets the container ulimit instead.
    nofiles = 0

    # Caddy overwrites X-Real-IP with the TCP peer address, so it cannot be spoofed.
    # strfry needs it only so the write policy can rate-limit per connection IP;
    # the IP is held in memory and never logged (logging below, --verbosity in
    # compose.yaml).
    realIpHeader = "x-real-ip"

    auth {
        # NIP-42 is optional and OFF by default. Turn on with RELAY_AUTH=true in .env
        # (compose.yaml sets enabled and serviceUrl). See README.md "NIP-42" for why
        # restrictedReadKinds is empty by default.
        enabled = false
        serviceUrl = ""
        restrictedReadKinds = ""
        restrictReadToInvolvedPubkey = true
    }

    info {
        # name, description, contact, pubkey, privacy and terms come from .env.
        name = "app relay"
        description = "Relay for a federated video app. Stores gift-wrapped (NIP-59) messages until their NIP-40 expiration."
        pubkey = ""
        self = ""
        contact = ""
        icon = ""
        banner = ""
        privacy = ""
        terms = ""
        nips = ""
    }

    maxWebsocketPayloadSize = 131072
    maxReqFilterSize = 200
    autoPingSeconds = 55
    enableTcpKeepalive = false
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 500
    maxTagsPerFilter = 3
    maxFilterLimitCount = 1000000
    maxSubsPerConnection = 50
    maxPendingOutboundBytes = 33554432

    writePolicy {
        # Rate limits, gift-wrap expiration rules and the optional kind allow-list.
        plugin = "/app/policy/write-policy.sh"
        timeoutSeconds = 10
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        # Rejection logging is off: rejected events are mostly abuse, and their log
        # lines are not needed to run the relay.
        invalidEvents = false
    }

    numThreads {
        ingester = 3
        reqWorker = 3
        reqMonitor = 3
        negentropy = 2
    }

    negentropy {
        enabled = true
        maxSyncEvents = 1000000
    }

    filterValidation {
        enabled = false
        maxFiltersPerReq = 3
        minFiltersPerReq = 1
        maxKindsPerFilter = 3
        allowedKinds = ""
        requireAuthorOrTag = false
    }
}
