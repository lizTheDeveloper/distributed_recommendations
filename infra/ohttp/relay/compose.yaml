# An Oblivious HTTP relay (docs/TRANSPORT.md). A separate stack ON PURPOSE:
# production deployments run it on another provider, by another operator, than
# ../gateway. The pair only protects users while the two don't collude.
#
#   cp .env.example .env   # RELAY_SITE, ACME_EMAIL, GATEWAY_URL, CORS_ORIGIN
#   docker compose up -d
#
# This is Caddy configured as a minimal single-gateway OHTTP relay. Managed OHTTP
# relays (e.g. Fastly's or Cloudflare's Privacy Gateway relay service) or
# payjoin/ohttp-relay are drop-in alternatives: the client only needs the relay URL.

name: ohttp-relay

x-logging: &logging
  driver: ${LOG_DRIVER:-local}
  options:
    max-size: "10m"
    max-file: "3"

services:
  relay:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    logging: *logging
    ports:
      - "${RELAY_BIND:-0.0.0.0}:${RELAY_HTTP_PORT:-80}:80"
      - "${RELAY_BIND:-0.0.0.0}:${RELAY_HTTPS_PORT:-443}:443"
    environment:
      RELAY_SITE: ${RELAY_SITE:?set RELAY_SITE in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      # The gateway's base URL (scheme://host[:port]); /gateway and /ohttp-keys are appended.
      GATEWAY_URL: ${GATEWAY_URL:?set GATEWAY_URL in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env (the app origin)}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp

volumes:
  caddy-data: {}
  caddy-config: {}
