# Dependency updates (docs/THREAT_MODEL.md T13: pinned and reviewed dependencies).
#
# - Everything stays pinned exactly: npm `save-exact`, actions by commit SHA,
#   container images by digest, Python by hash. Dependabot rewrites the pins.
# - cooldown: a release must be 14 days old before Dependabot proposes it, so a
#   compromised publish has time to be noticed and yanked (security updates skip it).
# - Every update is a PR that CI and a human review; nothing auto-merges.
# - New package directories must be added below by hand.

version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /packages/match
      - /packages/bridge
      - /packages/circles
      - /packages/moderation
      - /packages/transport
      - /packages/analytics
      - /services/labeler
      # packages/taste has no lockfile on purpose: it imports packages/bridge and
      # packages/core from source and resolves nostr-tools (and tsc) from
      # packages/bridge, which is covered above. Add it here if it gets its own lockfile.
      - /apps/web
      - /apps/mobile
      - /apps/desktop
      - /infra/web/deploy-tools/ipfs
      - /infra/web/deploy-tools/cloudflare
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels: [dependencies, javascript]
    commit-message:
      prefix: "deps(npm)"
    groups:
      typescript-tooling:
        patterns: ["typescript", "@types/*", "esbuild"]
      capacitor:
        patterns: ["@capacitor/*"]
      deploy-tools:
        patterns: ["wrangler", "ipfs-car", "@storacha/*"]
      ohttp:
        patterns: ["ohttp-ts", "hpke", "bhttp-ts"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    labels: [dependencies, rust]
    commit-message:
      prefix: "deps(desktop)"
    groups:
      tauri:
        patterns: ["tauri*"]

  # Android (Capacitor) build: the Android Gradle Plugin, androidx versions in
  # variables.gradle, and the wrapper. Capacitor's own Android modules come from npm
  # (@capacitor/* above) and capacitor.*.gradle are regenerated by `cap sync`.
  # gradle/verification-metadata.xml is NOT updated by Dependabot: regenerate it
  # (./gradlew --write-verification-metadata sha256 help) and review the diff in the PR.
  - package-ecosystem: gradle
    directory: /apps/mobile/android
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    labels: [dependencies, android]
    commit-message:
      prefix: "deps(android)"
    groups:
      androidx:
        patterns: ["androidx.*"]

  - package-ecosystem: docker-compose
    directory: /infra/relay
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    labels: [dependencies, docker]
    commit-message:
      prefix: "deps(relay)"

  # The other self-hosted stacks. Images are pinned by digest in compose.yaml. Run the
  # matching suite in .github/workflows/e2e.yml (manual) on each of these PRs.
  # Check by hand: images named through a variable (Janus's
  # `${DOCKERHUB:-docker.io}/library/postgres`) and the `ARG ..._IMAGE` defaults in
  # infra/ohttp/gateway/Dockerfile.*, which Dependabot may not follow. The same
  # node/golang digests are repeated in infra/ohttp/e2e/run.sh (mirror override).
  - package-ecosystem: docker-compose
    directories:
      - /infra/ohttp/gateway
      - /infra/ohttp/relay
      - /infra/janus/leader
      - /infra/janus/helper
      - /infra/glitchtip
      - /infra/umami
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    labels: [dependencies, docker]
    commit-message:
      prefix: "deps(infra)"
    groups:
      caddy:
        patterns: ["caddy"]
      postgres:
        patterns: ["postgres", "*/postgres"]

  # Base images of the images built here: the labeler (FROM lines) and the OHTTP
  # gateway/target (ARG defaults, see above).
  - package-ecosystem: docker
    directories:
      - /infra/labeler
      - /infra/ohttp/gateway
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    labels: [dependencies, docker]
    commit-message:
      prefix: "deps(images)"

  - package-ecosystem: pip
    directory: /.github/ci
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    labels: [dependencies, python]
    commit-message:
      prefix: "deps(sim)"
